name: 自动测试直播源并更新可用列表

on:
  # 每 6 小时自动测试（UTC 时间；上游同步为 0/6/12/18 点 UTC，本任务错后 40 分钟运行）
  schedule:
    - cron: '40 */6 * * *'
  # 支持手动触发
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-iptv:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 测试直播源可用性
        run: python tools/check_iptv.py "$GITHUB_WORKSPACE"

      - name: 提交并推送可用列表更新
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add tv/iptv4_checked.txt tv/iptv4_dead.txt tools/check_iptv.py
          if git diff --cached --quiet; then
            echo "本次无变化，跳过提交"
          else
            git commit -m "自动更新可用直播源列表"
            git push origin master
          fi
